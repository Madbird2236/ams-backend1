<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body><div id="stage">
<svg id="svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <radialGradient id="hall" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#2a2016"/><stop offset=".55" stop-color="#120e0a"/><stop offset="1" stop-color="#070605"/></radialGradient>
    <linearGradient id="boards" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2118"/><stop offset="1" stop-color="#6b5038"/></linearGradient>
    <radialGradient id="spot" cx="50%" cy="58%" r="55%"><stop offset="0" stop-color="#F6D7A6" stop-opacity=".28"/><stop offset="1" stop-color="#F6D7A6" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="A"><rect width="1080" height="1350" fill="url(#hall)"/><g id="dots"></g></g>
  <g id="B" opacity="0">
    <rect width="1080" height="1350" fill="url(#boards)"/>
    <g id="planks"></g>
    <rect width="1080" height="1350" fill="url(#spot)"/>
    <g id="sheets"></g>
    <g id="stand"></g>
  </g>
  <path id="baton" d="M330,1060 L740,520" stroke="#F6F2EA" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle id="tip" cx="740" cy="520" r="10" fill="#fff" filter="url(#glow)" opacity="0"/>
</svg>
<div class="layer"><div class="label">Studie 1 · Formschnitt</div></div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="lib.js"></script>
<script>
gsap.registerPlugin(DrawSVGPlugin);
const R = rnd(5), $ = (i) => document.getElementById(i), tl = gsap.timeline({ defaults: { ease: "power3.out" } });
// A: concert hall lights
const dl = [];
for (let r = 0; r < 4; r++) { const n = 13 + r * 2; for (let i = 0; i < n; i++) {
  const x = 40 + (1000 / (n - 1)) * i, y = 300 + r * 105 - 70 * Math.pow((x - 540) / 540, 2);
  const g = el("g", { transform: `translate(${x},${y})` }, $("dots"));
  el("circle", { r: (4 + r * 1.3) * 3.2, fill: "#F2BE73", opacity: .22, filter: "url(#glow)" }, g); el("circle", { r: 4 + r * 1.3, fill: "#FFD9A0" }, g); dl.push(g); } }
tl.from(dl, { opacity: 0, scale: .3, duration: .6, stagger: { each: .006, from: "center" } }, .1)
  .fromTo("#baton", { drawSVG: "0% 0%" }, { drawSVG: "0% 100%", duration: .5 }, .3)
  .to("#tip", { opacity: 1, duration: .15 }, .8).to("#tip", { opacity: 0, duration: .4 }, 1.0)
  .to("#A", { scale: 1.06, transformOrigin: "535px 790px", duration: 2.3, ease: "sine.in" }, .1)       // slow push on the baton's axis
  .to("#baton", { attr: { "stroke-width": 9 }, duration: 1.6, ease: "sine.in" }, .8);
// B: stage floor; the fallen stand lies exactly on the baton's line (same angle, same position)
for (let i = 0; i < 14; i++) el("line", { x1: 540 + (i - 7) * 40, y1: 560, x2: 540 + (i - 7) * 200, y2: 1350, stroke: "#1d1610", "stroke-width": 2, opacity: .7 }, $("planks"));
const st = $("stand");
const pole = el("path", { d: "M330,1060 L740,520", stroke: "#F6F2EA", "stroke-width": 9, "stroke-linecap": "round", fill: "none" }, st);
const desk = el("path", { d: "M690,430 L860,560 L780,665 L610,535 Z", stroke: "#F6F2EA", "stroke-width": 7, "stroke-linejoin": "round", fill: "#1a1511" }, st);
const legs = el("path", { d: "M330,1060 L250,1000 M330,1060 L300,1160", stroke: "#F6F2EA", "stroke-width": 7, "stroke-linecap": "round", fill: "none" }, st);
const sheets = [];
for (let i = 0; i < 7; i++) {
  const g = el("g", {}, $("sheets")), inner = el("g", { transform: "translate(-85,-110)" }, g);
  el("rect", { width: 170, height: 220, rx: 3, fill: "#EFE8DA" }, inner);
  for (let s = 0; s < 3; s++) for (let l = 0; l < 5; l++) el("line", { x1: 16, x2: 154, y1: 40 + s * 58 + l * 6, y2: 40 + s * 58 + l * 6, stroke: "#8a8172", "stroke-width": 1.2 }, inner);
  gsap.set(g, { x: 740, y: 540, rotation: -40, scale: .5, transformOrigin: "0 0" });
  sheets.push({ g, x: 160 + R() * 760, y: 700 + R() * 520, r: (R() - .5) * 120 });
}
// the cut: on the crash (2.4 s) — no dissolve, the line carries the eye
tl.set("#B", { opacity: 1 }, 2.4).set("#A", { opacity: 0 }, 2.4).set("#baton", { opacity: 0 }, 2.4)
  .fromTo(st, { rotation: -4 }, { rotation: 0, svgOrigin: "330 1060", duration: .5, ease: "bounce.out" }, 2.4)
  .fromTo("#B", { scale: 1.06 }, { scale: 1.0, transformOrigin: "535px 790px", duration: 1.6, ease: "power2.out" }, 2.4);
sheets.forEach((s, i) => tl.to(s.g, { x: s.x, y: s.y, rotation: s.r, scale: .9, duration: 1.1, ease: "power3.out" }, 2.42 + i * .03));
tl.to({}, { duration: .01 }, 3.99);
mount(tl, 4);
</script></body></html>
